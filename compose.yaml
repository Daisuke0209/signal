services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: signal
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signal"]
      interval: 2s
      timeout: 3s
      retries: 10
    volumes:
      - signal-postgres:/var/lib/postgresql/data

volumes:
  signal-postgres: